name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Ejecutar pruebas
        run: npm test -- --coverage

  sca:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Auditoría de dependencias
        run: npm audit --audit-level=high

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Instalar Gitleaks
        run: |
          GITLEAKS_VERSION="8.21.2"
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            -o gitleaks.tar.gz
          tar -xzf gitleaks.tar.gz gitleaks
          chmod +x gitleaks
          ./gitleaks version

      - name: Escanear historial Git (modo git)
        run: |
          ./gitleaks git \
            --log-opts="HEAD" \
            --redact \
            --exit-code 1 \
            --config gitleaks.toml \
            .

      - name: Crear snapshot de archivos versionados (HEAD)
        run: |
          TRACKED_SNAPSHOT="$(mktemp -d)"
          echo "TRACKED_SNAPSHOT=${TRACKED_SNAPSHOT}" >> "$GITHUB_ENV"
          git archive HEAD | tar -x -C "${TRACKED_SNAPSHOT}"

      - name: Escanear snapshot de archivos versionados (modo dir)
        run: |
          ./gitleaks dir \
            --redact \
            --exit-code 1 \
            --config gitleaks.toml \
            "${TRACKED_SNAPSHOT}"
